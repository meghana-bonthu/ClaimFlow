name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: .NET build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release --collect:"XPlat Code Coverage" --results-directory ./coverage --logger trx
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: coverage

  frontend:
    name: Angular build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/claimflow-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/claimflow-web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run test:ci

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f src/ClaimFlow.Api/Dockerfile -t claimflow-api .
      - run: docker build -t claimflow-web web/claimflow-web
